name: Flashtext
targets:
  Flashtext:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Flashtext
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flashtext.app
        MARKETING_VERSION: 1.0.1
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: Flashtext/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Flashtext/Resources/Flashtext.entitlements
        SWIFT_VERSION: "5.9"
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: []

settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
